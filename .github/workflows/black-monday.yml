name: Run Black Monday analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-garch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Python packages on the runner
        run: python -m pip install -r requirements.txt
      - name: Download daily closes
        run: python download_data.py
      - name: Fit models and generate results
        run: python black_monday.py
      - uses: actions/upload-artifact@v7
        with:
          name: black-monday-results
          path: outputs/
          if-no-files-found: error
